plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.ladysnake.org/releases" }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // sqlite-jdbc via Fabric-loom JarInJar (include) — NOT shaded. libsqlitejdbc.{so,dylib,dll}
    // has FindClass("org/sqlite/core/NativeDB") baked into JNI_OnLoad, so relocation breaks
    // the native binding. include + compileOnly mirrors the Forge/NeoForge JiJ shape.
    include 'org.xerial:sqlite-jdbc:3.45.1.0'
    compileOnly 'org.xerial:sqlite-jdbc:3.45.1.0'
    // Loom runServer does not load fabric.mod.json nested jars; production still ships via include.
    modLocalRuntime 'org.xerial:sqlite-jdbc:3.45.1.0'

    modCompileOnly "dev.emi:trinkets:3.7.1"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // === sqlite-jdbc is NOT shaded — ships via Fabric-loom JarInJar (include). ===
    // Relocation would break JNI; loom dedups by Maven coords.

    // Drop signature files + license noise that breaks merged jars
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/versions/**/module-info.class'
    exclude 'module-info.class'
    // Belt-and-braces: even if a transitive dep slips sqlite into shadowBundle, drop it. JiJ is the only sqlite path.
    exclude 'org/sqlite/**'

    mergeServiceFiles()
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
