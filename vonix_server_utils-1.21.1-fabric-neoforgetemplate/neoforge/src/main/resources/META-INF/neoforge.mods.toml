modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "vonix_server_utilities"
version = "${version}"
displayName = "Vonix Server Utilities"
authors = "Vonix Network"
description = '''
Full-featured server utility mod: homes, warps, kits, TPA, teleport, admin tools, world commands, and moderation.
'''

[[dependencies.vonix_server_utilities]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.vonix_server_utilities]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"

# LuckPerms — optional. If installed, VonixServerUtilities will auto-create
# donation rank groups + sync players on join. Not installed = donation_ranks
# feature self-disables with a clear log warning.
[[dependencies.vonix_server_utilities]]
modId = "luckperms"
type = "optional"
versionRange = "[5.4,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "vonix_server_utilities.mixins.json"
