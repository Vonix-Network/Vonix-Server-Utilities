architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    compileOnly 'org.xerial:sqlite-jdbc:3.45.1.0'
    testImplementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.slf4j:slf4j-nop:1.7.36'
    compileOnly 'net.luckperms:api:5.4'
}

tasks.register('crateRulesTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'network.vonix.serverutilities.crates.CrateRulesTest'
}

tasks.register('muteStateTest', JavaExec) {
    group = 'verification'
    description = 'Runs optimistic mute persistence and expiry-state regression checks.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'network.vonix.serverutilities.moderation.MuteStateTest'
}

tasks.register('kitGroupsTest', JavaExec) {
    group = 'verification'
    description = 'Runs kit-group JSON, claim, migration, and concurrency regression checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'network.vonix.serverutilities.kits.KitGroupsTest'
}

tasks.named('check') {
    dependsOn tasks.named('crateRulesTest')
    dependsOn tasks.named('muteStateTest')
    dependsOn tasks.named('kitGroupsTest')
}
