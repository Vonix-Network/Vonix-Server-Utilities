plugins {
    id "net.neoforged.moddev" version "2.0.140"
    id "maven-publish"
}

version = mod_version
group = maven_group

base {
    // Emit the user-facing matrix identity directly in the filename.
    archivesName = "vsu-${minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = "https://maven.theillusivec4.top/" }
}

dependencies {
    // SQLite is a runtime dependency of Database and must be embedded using
    // ModDevGradle's supported Jar-in-Jar configuration. The bounded range
    // keeps NeoForge's nested-jar resolver compatible with other mods that
    // embed the same library while preferring the tested version.
    jarJar(implementation("org.xerial:sqlite-jdbc:3.46.1.0")) {
        version {
            strictly "[3.46.1.0,)"
            prefer "3.46.1.0"
        }
    }

    // Optional integrations remain compile-only; their target-compatible
    // runtime mods are supplied by the server when present.
    compileOnly "net.luckperms:api:5.4"
    testImplementation "org.xerial:sqlite-jdbc:3.46.1.0"
    testImplementation "com.google.code.gson:gson:2.10.1"
    testRuntimeOnly "org.slf4j:slf4j-nop:2.0.13"
}

neoForge {
    version = neoforge_version
    validateAccessTransformers = true

    runs {
        server {
            server()
            gameDirectory = project.file("runs/server")
        }
    }

    mods {
        vonix_server_utilities {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: project.version
    }
}

sourceSets {
    main {
        java {
            srcDir "../core/src/main/java"
        }
    }
    test {
        java.srcDir "src/test/java"
    }
}

tasks.register("muteStateTest", JavaExec) {
    group = "verification"
    description = "Runs optimistic mute persistence and expiry-state regression checks."
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "network.vonix.serverutilities.moderation.MuteStateTest"
}

tasks.register("crateRulesTest", JavaExec) {
    group = "verification"
    description = "Runs crate percentage, selection, playtime, and identifier regression checks."
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "network.vonix.serverutilities.crates.CrateRulesTest"
}

tasks.register("kitGroupsTest", JavaExec) {
    group = "verification"
    description = "Runs kit-group JSON, claim, migration, and concurrency regression checks."
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "network.vonix.serverutilities.kits.KitGroupsTest"
}

tasks.register("panelSpiSmokeTest", JavaExec) {
    group = "verification"
    description = "Runs companion panel SPI contract smoke checks."
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "network.vonix.serverutilities.api.PanelSpiSmokeTest"
}

tasks.named("check") {
    dependsOn tasks.named("muteStateTest")
    dependsOn tasks.named("crateRulesTest")
    dependsOn tasks.named("kitGroupsTest")
    dependsOn tasks.named("panelSpiSmokeTest")
}

tasks.named("test") {
    // Regression probes are JavaExec main classes; no JUnit discovery is expected.
    failOnNoDiscoveredTests = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
