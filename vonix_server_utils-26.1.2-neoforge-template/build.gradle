plugins {
    id "net.neoforged.moddev" version "2.0.140"
    id "maven-publish"
}

version = mod_version
group = maven_group

base {
    // Emit the user-facing matrix identity directly in the filename.
    archivesName = "vsu-${minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = "https://maven.theillusivec4.top/" }
}

dependencies {
    // SQLite is a runtime dependency of Database and must be embedded using
    // ModDevGradle's supported Jar-in-Jar configuration. The bounded range
    // keeps NeoForge's nested-jar resolver compatible with other mods that
    // embed the same library while preferring the tested version.
    jarJar(implementation("org.xerial:sqlite-jdbc:3.46.1.0")) {
        version {
            strictly "[3.46.1.0,)"
            prefer "3.46.1.0"
        }
    }

    // Optional integrations remain compile-only; their target-compatible
    // runtime mods are supplied by the server when present.
    compileOnly "net.luckperms:api:5.4"
    // Runtime classpath for the ownership-gate test. compileOnly is not visible there.
    testImplementation "net.luckperms:api:5.4"
    testImplementation "org.xerial:sqlite-jdbc:3.46.1.0"
    testImplementation "com.google.code.gson:gson:2.10.1"
    // Compile the ownership-gate JUnit entry. NeoForge's unit-test fixtures
    // supply junit-fml, which installs a current FML loader before the test runs.
    testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
    // Gradle 9 does not put the JUnit Platform launcher on the test runtime
    // classpath. Jupiter 5.13.4 brings platform engine 1.13.4, not the launcher,
    // so the NeoForge unit-test worker stopped before discovery. Keep them aligned.
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"
    testRuntimeOnly "org.slf4j:slf4j-nop:2.0.13"
}

neoForge {
    version = neoforge_version
    validateAccessTransformers = true

    runs {
        server {
            server()
            gameDirectory = project.file("runs/server")
        }
    }

    mods {
        vonix_server_utilities {
            sourceSet sourceSets.main
        }
    }

    // The public RankSyncTask.onJoin(ServerPlayer) probe initializes ServerPlayer.
    // That class loads AttachmentHolder, which requires a current FML loader.
    // A plain JavaExec has none. NeoForge's unit-test session installs one.
    // The session's ModuleClassLoader only sees test classes when testedMod
    // names a mods {} entry. loadedMods already defaults to every such entry.
    // ModDevGradle 2.0.140 then adds the test source set to that mod.
    unitTest {
        enable()
        testedMod = mods.vonix_server_utilities
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: project.version
    }
}

sourceSets {
    main {
        java {
            srcDir "../core/src/main/java"
        }
    }
    test {
        java.srcDir "src/test/java"
    }
}

// ModDev exposes Minecraft on the main compile classpath only. The plain
// JavaExec probes still need those types, and the full main runtime classpath
// pulls in the NeoForge DevLaunch launcher, which those probes do not run.
// The ownership gate itself is the JUnit test task: NeoForge's unit-test
// session installs a current FML loader before ServerPlayer is initialized.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

tasks.register("muteStateTest", JavaExec) {
    group = "verification"
    description = "Runs optimistic mute persistence and expiry-state regression checks."
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "network.vonix.serverutilities.moderation.MuteStateTest"
}

tasks.register("crateRulesTest", JavaExec) {
    group = "verification"
    description = "Runs crate percentage, selection, playtime, and identifier regression checks."
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "network.vonix.serverutilities.crates.CrateRulesTest"
}

tasks.register("kitGroupsTest", JavaExec) {
    group = "verification"
    description = "Runs kit-group JSON, claim, migration, and concurrency regression checks."
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "network.vonix.serverutilities.kits.KitGroupsTest"
}

tasks.register("panelSpiSmokeTest", JavaExec) {
    group = "verification"
    description = "Runs companion panel SPI contract smoke checks."
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "network.vonix.serverutilities.api.PanelSpiSmokeTest"
}

tasks.register("donationRankOwnershipGateTest") {
    group = "verification"
    description = "Proves a disabled donation_ranks feature performs no player or LuckPerms group sync, including RankSyncTask.onJoin(ServerPlayer) under the NeoForge unit-test loader."
    dependsOn tasks.named("test")
}

tasks.named("check") {
    dependsOn tasks.named("muteStateTest")
    dependsOn tasks.named("crateRulesTest")
    dependsOn tasks.named("kitGroupsTest")
    dependsOn tasks.named("panelSpiSmokeTest")
    dependsOn tasks.named("donationRankOwnershipGateTest")
}

tasks.named("test") {
    // The other regression probes stay JavaExec tasks. This task is only the
    // ownership gate, because that probe has to run after FML loader startup.
    useJUnitPlatform()
    failOnNoDiscoveredTests = true
    filter {
        includeTestsMatching("network.vonix.serverutilities.donation_ranks.DonationRankOwnershipGateJUnit")
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
