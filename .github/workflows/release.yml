name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset_base }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: 'vonix_server_utils-1.18.2-fabric-forge-template', loader: 'fabric', jdk: '21', gradle: '8.10.2', asset_base: 'vsu-1.18.2-fabric', pattern: 'vsu-1.18.2-fabric-*.jar' }
          - { project: 'vonix_server_utils-1.18.2-fabric-forge-template', loader: 'forge', jdk: '21', gradle: '8.10.2', asset_base: 'vsu-1.18.2-forge', pattern: 'vsu-1.18.2-forge-*.jar' }
          - { project: 'vonix_server_utils-1.19.2-fabric-forge-template', loader: 'fabric', jdk: '21', gradle: '8.10.2', asset_base: 'vsu-1.19.2-fabric', pattern: 'vsu-1.19.2-fabric-*.jar' }
          - { project: 'vonix_server_utils-1.19.2-fabric-forge-template', loader: 'forge', jdk: '21', gradle: '8.10.2', asset_base: 'vsu-1.19.2-forge', pattern: 'vsu-1.19.2-forge-*.jar' }
          - { project: 'vonix_server_utils-1.20.1-fabric-forge-template', loader: 'fabric', jdk: '21', gradle: '8.10.2', asset_base: 'vsu-1.20.1-fabric', pattern: 'vsu-1.20.1-fabric-*.jar' }
          - { project: 'vonix_server_utils-1.20.1-fabric-forge-template', loader: 'forge', jdk: '21', gradle: '8.10.2', asset_base: 'vsu-1.20.1-forge', pattern: 'vsu-1.20.1-forge-*.jar' }
          - { project: 'vonix_server_utils-1.21.1-fabric-neoforgetemplate', loader: 'fabric', jdk: '21', gradle: '8.14', asset_base: 'vsu-1.21.1-fabric', pattern: 'vsu-1.21.1-fabric-*.jar' }
          - { project: 'vonix_server_utils-1.21.1-fabric-neoforgetemplate', loader: 'neoforge', jdk: '21', gradle: '8.14', asset_base: 'vsu-1.21.1-neoforge', pattern: 'vsu-1.21.1-neoforge-*.jar' }
          - { project: 'vonix_server_utils-26.1.2-neoforge-template', loader: 'neoforge', jdk: '25', gradle: '9.2.0', asset_base: 'vsu-26.1.2-neoforge', pattern: 'vsu-26.1.2-neoforge-*.jar' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ matrix.asset_base }}-${{ hashFiles(format('{0}/**/*.gradle*', matrix.project), format('{0}/gradle.properties', matrix.project)) }}
      - name: Build ${{ matrix.loader }}
        working-directory: ${{ matrix.project }}
        run: gradle build --no-daemon
      - name: Select release jar
        id: jar
        working-directory: ${{ matrix.project }}
        env:
          JAR_PATTERN: ${{ matrix.pattern }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          JAR="$(find . -type f -path '*/build/libs/*.jar' -name "$JAR_PATTERN" ! -name '*sources*' ! -name '*dev*' ! -name '*shadow*' ! -name '*slim*' | head -n 1)"
          test -n "$JAR"
          ASSET_NAME="${{ matrix.asset_base }}-${VERSION#v}"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$JAR" "$RUNNER_TEMP/release/${ASSET_NAME}.jar"
          echo "path=$RUNNER_TEMP/release/${ASSET_NAME}.jar" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.asset_base }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jar-*
          merge-multiple: true
      - name: Stage assets and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f -name '*.jar' -exec cp {} release/ \;
          test "$(find release -maxdepth 1 -name '*.jar' | wc -l)" -eq 9
          (cd release && sha256sum *.jar > SHA256SUMS)
      - name: Write release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## Vonix Server Utilities ${GITHUB_REF_NAME}"
            echo
            echo "All nine supported Minecraft/loader lanes are built by GitHub Actions from this tag."
            echo
            echo "### Artifact matrix"
            echo
            echo "| Asset | MC Version | Loader |"
            echo "|---|---|---|"
            for jar in release/*.jar; do
              base="$(basename "$jar" .jar)"
              matrix="${base#vsu-}"
              matrix="${matrix%-*}"
              loader="${matrix##*-}"
              mc="${matrix%-*}"
              printf '| `%s.jar` | %s | %s |\n' "$base" "$mc" "$loader"
            done
            echo
            echo "### Checksums"
            echo
            echo "\`\`\`"
            cat release/SHA256SUMS
            echo "\`\`\`"
          } > release/RELEASE-NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release/RELEASE-NOTES.md
          files: |
            release/*.jar
            release/SHA256SUMS
          draft: false
          prerelease: false
